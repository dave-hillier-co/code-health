<p class="legend">Each folder is a row, indented under its parent. A folder with nothing of its own and one child is joined to that child.</p>
<p class="legend">An arrow runs from the folder a unit is in to the folder it moves to. Its number is the unit's number in the table, its thickness grows with gain, and the row text prints the number and gain. A solid line and a dashed line are told apart by the word in the row text as well as by the dash.</p>
<p class="legend">move: the planner can plan it</p>
<p class="legend">blocked move (dashed line): a dependency that stays behind holds it back</p>
<p class="legend">review: a unit with no single target</p>
<p class="legend">consumer of: a folder with a file that uses unit N</p>
<p class="legend">3 more moves are not drawn: the map draws the top 10.</p>
