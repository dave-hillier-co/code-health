<p class="legend">The dashed diagonal is the main sequence, where A + I = 1. A zone starts 0.5 from it (structure.packages.zoneDistance): the zone of pain is concrete and stable (A + I at most 0.5) and the zone of uselessness is abstract and unstable (A + I at least 1.5). Square points are inside a zone, round points are not, and the table gives each position in words. A guideline orders and labels results; it decides nothing.</p>
<p class="legend">Of the 3 measured packages, 1 are in the zone of pain, 1 in the zone of uselessness and 1 outside the zones.</p>
