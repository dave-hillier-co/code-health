name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-bump check compares against the merge base, and the
          # tests build fixture repositories, so history must be complete.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Fail if the committed dist is not what the build produces
        run: |
          git diff --exit-code -- plugins
          untracked="$(git status --porcelain --untracked-files=all -- plugins)"
          if [ -n "$untracked" ]; then
            echo "The build produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi

      - name: Version bump
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: npm run check:version-bump

      - name: Golden outputs match their JSON Schemas
        run: npm run check:schemas

      - name: Install the claude CLI
        # Optional: the next step skips with a notice when this fails.
        continue-on-error: true
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate the marketplace and plugins
        run: npm run check:plugins
