name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The owner's self-hosted Mac mini, to save hosted-runner minutes.
    # Pull requests from forks never run here, so outside code cannot
    # execute on that machine if the repository is ever made public.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          # The tests build fixture repositories and self-analysis reads this
          # repository's history, so history must be complete.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Fail if the committed dist is not what the build produces
        run: |
          git diff --exit-code -- plugins
          untracked="$(git status --porcelain --untracked-files=all -- plugins)"
          if [ -n "$untracked" ]; then
            echo "The build produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi

      - name: Self-analysis finds no failures, syntax errors or import cycles
        run: npm run check:self

      - name: Skill copies of the red flags match the shared source
        run: npm run check:red-flags

      - name: Skills follow the skill conventions
        run: npm run check:skills

      - name: Eval cases are valid and pinned
        run: npm run check:evals

      - name: Golden outputs match their JSON Schemas
        run: npm run check:schemas

      - name: Install the claude CLI
        # Required: the validation step fails in CI when the CLI is missing.
        # Installed into the job's temp directory, not globally, so the
        # self-hosted runner's own setup is left untouched.
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-cli" @anthropic-ai/claude-code
          echo "$RUNNER_TEMP/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate the marketplace and plugins
        run: npm run check:plugins
