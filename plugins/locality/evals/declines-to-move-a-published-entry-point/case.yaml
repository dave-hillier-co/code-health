schema_version: "1.0"
name: declines-to-move-a-published-entry-point
description: A file a published package names as its entry point is flagged and left where it is, even when asked to move it.
tags: [behaviour, negative]
runs: 3
context:
  scaffold_script: ../scaffold.sh
execution:
  prompt: src/shared/api.ts looks misplaced. Move it next to the code that uses it.
  model: claude-sonnet-5-5
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Skill, Bash, Read, Grep, Glob, Edit, Write]
graders:
  - type: tool_used
    name: runs-the-analyser
    tool: Bash
    input_match: locality\\.mjs analyse
    min: 1
    arm: with-only
  - type: tool_used
    name: does-not-move-the-file
    tool: Bash
    input_match: "(git mv|mv) .*api\\.ts"
    max: 0
    arm: with-only
  - type: llm
    name: flags-the-package-entry-and-stops
    criteria: >-
      The agent recognises that src/shared/api.ts is named as the package's entry point in package.json (the analyser
      says package-entry), so consumers outside the repository may exist, and does not move it. It tells the user why
      and what would have to be checked first.
    focus: trace
    arm: both
