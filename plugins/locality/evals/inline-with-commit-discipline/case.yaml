schema_version: "1.0"
name: inline-with-commit-discipline
description: The skill analyses first, inlines only the unit the evidence supports, in a commit of its own that records the rule and carries the Code-Health trailer.
tags: [behaviour]
runs: 1
context:
  scaffold_script: ../scaffold.sh
execution:
  prompt: Use the locality analysis to tidy this repo. Apply only what it recommends with confidence, and commit each change.
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 600
  allowed_tools: [Skill, Bash, Read, Edit, Write, Grep, Glob]
graders:
  - type: tool_order
    name: analyses-before-editing
    before:
      tool: Bash
      input_match: locality\.mjs analyse
    after:
      tool: Edit
  - type: regex
    name: commit-carries-the-trailer
    target: trace
    pattern: "Code-Health: locality"
  - type: regex
    name: money-formatter-is-left-alone
    target: trace
    pattern: git mv .*money\.ts
    match: not_contains
  - type: llm
    name: one-refactoring-per-commit
    criteria: The agent inlined slugify into place.ts (or moved it next to place.ts) as its own commit, with a message that names the rule that fired and the consumer count, without changing behaviour in the same commit. It did not create any new helper or abstraction.
