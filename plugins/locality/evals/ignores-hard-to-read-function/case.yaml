schema_version: "1.0"
name: ignores-hard-to-read-function
description: A request to tidy one hard-to-read function is a complexity question. The locality skill stays unloaded.
tags: [trigger, negative]
runs: 3
context:
  scaffold_script: ../scaffold.sh
execution:
  prompt: The place function in src/orders/place.ts is hard to read. Can you make it clearer?
  model: claude-sonnet-5-5
  max_turns: 10
  timeout_seconds: 200
  allowed_tools: [Skill, Bash, Read, Edit, Grep, Glob]
graders:
  - type: tool_used
    name: does-not-load-the-locality-skill
    tool: Skill
    input_match: locality
    max: 0
    arm: with-only
