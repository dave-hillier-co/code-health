schema_version: "1.0"
name: smoke
description: Proves the eval format validates. Replace with real trigger and behaviour cases once the plugin has a skill.
tags: [example]
runs: 1
execution:
  prompt: Reply with the single word ready and nothing else.
  model: claude-sonnet-5-5
  max_turns: 2
  timeout_seconds: 120
graders:
  - type: regex
    name: says-ready
    pattern: "^\\s*ready\\W*$"
    flags: i
    target: last_message
    arm: both
