schema_version: "1.0"
name: trigger-risky-file
description: "The cochange skill loads on a prompt about change history, as a user would phrase it."
tags: [trigger, positive]
runs: 3
execution:
  prompt: "Is parser.ts a risky file to edit? How often does it change and what usually changes with it?"
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 180
graders:
  - type: "tool_used"
    name: "loads-the-cochange-skill"
    tool: "Skill"
    input_match: "cochange"
    min: 1
    arm: "with-only"
