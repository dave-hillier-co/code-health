schema_version: "1.0"
name: abandonment-trigger-truck-factor
description: "The abandonment skill loads on a question about knowledge loss when people leave, as a user would phrase it."
tags: [trigger, positive, abandonment]
runs: 3
execution:
  prompt: "If a couple of our engineers left this year, how much of this code would nobody on the team understand any more?"
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 180
graders:
  - type: "tool_used"
    name: "loads-the-abandonment-skill"
    tool: "Skill"
    input_match: "abandonment"
    min: 1
    arm: "with-only"
