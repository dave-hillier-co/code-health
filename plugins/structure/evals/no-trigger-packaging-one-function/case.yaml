schema_version: "1.0"
name: no-trigger-packaging-one-function
description: A request to tidy one function inside a package is not a question about packages. The packaging skill stays unloaded and its CLI is not run.
tags: [trigger, negative]
runs: 3
context:
  scaffold_script: ../packaging-scaffold.sh
execution:
  prompt: The weekday function in packages/ui/src/dates.ts uses an array lookup that is hard to read. Can you rewrite just that function with Intl.DateTimeFormat?
  model: claude-sonnet-5-5
  max_turns: 10
  timeout_seconds: 200
  allowed_tools: [Skill, Bash, Read, Edit, Grep, Glob]
graders:
  - type: tool_used
    name: does-not-load-the-packaging-skill
    tool: Skill
    input_match: packaging
    max: 0
    arm: with-only
  - type: tool_used
    name: does-not-run-the-packages-cli
    tool: Bash
    input_match: "structure\\.mjs packages"
    max: 0
    arm: with-only
