schema_version: "1.0"
name: abandonment-no-trigger-rename
description: "The abandonment skill stays unloaded on a task that has nothing to do with people or history."
tags: [trigger, negative, abandonment]
runs: 3
execution:
  prompt: "Rename the variable `tmp` to `result` in src/util/format.ts."
  model: claude-sonnet-5-5
  max_turns: 6
  timeout_seconds: 180
graders:
  - type: "tool_used"
    name: "does-not-load-the-abandonment-skill"
    tool: "Skill"
    input_match: "abandonment"
    max: 0
    arm: "with-only"
