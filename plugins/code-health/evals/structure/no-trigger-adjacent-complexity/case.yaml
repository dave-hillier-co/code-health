schema_version: "1.0"
name: no-trigger-adjacent-complexity
description: A question about one function that is hard to read belongs to the complexity skill. The structure skill stays unloaded.
tags: [trigger, negative]
runs: 3
context:
  scaffold_script: ../scaffold.sh
execution:
  prompt: The place function in src/orders/place.ts is getting hard to read. Can you tidy that one function?
  model: claude-sonnet-5-5
  max_turns: 10
  timeout_seconds: 200
  allowed_tools: [Skill, Bash, Read, Edit, Grep, Glob]
graders:
  - type: tool_used
    name: does-not-load-the-structure-skill
    tool: Skill
    input_match: structure
    max: 0
    arm: with-only
