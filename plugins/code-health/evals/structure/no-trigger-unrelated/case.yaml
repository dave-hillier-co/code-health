schema_version: "1.0"
name: no-trigger-unrelated
description: The skill stays unloaded for a task that has nothing to do with dependencies between modules.
tags: [trigger, negative]
runs: 3
context:
  scaffold_script: ../scaffold.sh
execution:
  prompt: Add a README.md with one sentence saying this is a small order and billing demo.
  model: claude-sonnet-5-5
  max_turns: 8
  timeout_seconds: 180
  allowed_tools: [Skill, Bash, Read, Write]
graders:
  - type: tool_used
    name: does-not-load-the-skill
    tool: Skill
    input_match: structure
    max: 0
    arm: with-only
  - type: tool_used
    name: does-not-run-the-cli
    tool: Bash
    input_match: "structure\\.mjs"
    max: 0
    arm: with-only
