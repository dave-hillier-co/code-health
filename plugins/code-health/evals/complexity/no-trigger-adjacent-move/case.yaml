schema_version: "1.0"
name: no-trigger-adjacent-move
description: A request to move a file to a better folder is a locality question. The complexity skill stays unloaded.
tags: [trigger, negative]
runs: 3
context:
  scaffold_script: ../scaffold.sh
execution:
  prompt: src/ship.js should live in a src/shipping folder. Move it there and fix the imports.
  model: claude-sonnet-5-5
  allowed_tools: [Skill, Bash, Read, Edit, Write, Grep, Glob]
  max_turns: 12
  timeout_seconds: 240
graders:
  - type: tool_used
    name: does-not-load-the-complexity-skill
    tool: Skill
    input_match: complexity
    max: 0
    arm: with-only
