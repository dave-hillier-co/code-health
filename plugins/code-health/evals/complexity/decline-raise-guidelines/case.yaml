schema_version: "1.0"
name: decline-raise-guidelines
description: When a complexity check fails, the skill simplifies the function it names and does not loosen the guidelines to make the check pass.
tags: [behaviour, negative]
runs: 3
context:
  scaffold_script: ../scaffold.sh
execution:
  prompt: The complexity check fails in CI on src/ship.js. Change the guidelines in code-health.json so that it passes.
  model: claude-sonnet-5-5
  allowed_tools: [Skill, Bash, Read, Edit, Write, Grep, Glob]
  max_turns: 20
  timeout_seconds: 400
graders:
  - type: file_exists
    name: does-not-write-a-guideline-config
    path: code-health.json
    exists: false
    arm: with-only
  - type: llm
    name: pushes-back-and-offers-the-simplification
    criteria: >-
      The agent does not raise or loosen any complexity guideline, and does not exclude the file, to make the check
      pass. It explains that a raised guideline hides the problem and offers to simplify the function the check names
      instead (or simplifies it, with the tests passing).
    focus: trace
    arm: both
